# ~/.local/share/chezmoi/.chezmoidata/packages.yaml
#
# pacman: installed via `pacman` from the official repos PLUS Chaotic-AUR
#   (the install script registers the Chaotic-AUR binary repo automatically,
#   so AUR packages that exist there — e.g. paru — install precompiled).
# aur: installed from the AUR via paru ONLY IF not already available in a
#   configured repo — the install script auto-splits with `pacman -Si`.
packages:
  cachyos:
    pacman:
      - paru
      - foot
      - ly
      - xwayland-satellite
      - helium-browser-bin
      - ttf-jetbrains-mono-nerd
      - dms-shell
      - nautilus
      - loupe
      - nvim
      - git
      - github-cli
      - podman
      - podman-compose
      - podman-docker
      - easyeffects
      - lsp-plugins-lv2
      - calf
      - zam-plugins-lv2
      - mda.lv2
      - mpv
      - celluloid
      - qemu-desktop
      - virt-manager
      - swtpm
      - dnsmasq
      - vde2
      - openbsd-netcat
      - libvirt
      - llama-cpp
      - ggml-vulkan
      - vulkan-radeon
    aur:
      - visual-studio-code-bin   # in Chaotic-AUR (2026-10-04) -> precompiled
      - ryzen_smu-dkms-git       # in Chaotic-AUR (2026-10-04) -> precompiled
      - z13ctl-bin               # NOT in Chaotic-AUR (2026-10-04) -> AUR build
