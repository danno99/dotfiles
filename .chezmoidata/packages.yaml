# ~/.local/share/chezmoi/.chezmoidata/packages.yaml
#
# pacman: installed via `pacman` from the official repos PLUS Chaotic-AUR
#   (the install script registers the Chaotic-AUR binary repo automatically).
#   Includes AUR packages that Chaotic-AUR precompiles — e.g. paru,
#   visual-studio-code-bin, ryzen_smu-dkms-git — so they install prebuilt.
# aur: genuinely AUR-only (NOT in any pacman repo) — installed from the AUR
#   via paru.
packages:
  cachyos:
    pacman:
      - paru
      - foot
      - ly
      - xwayland-satellite
      - helium-browser-bin
      - ttf-jetbrains-mono-nerd
      - dms-shell
      - nautilus
      - loupe
      - nvim
      - git
      - github-cli
      - podman
      - podman-compose
      - podman-docker
      - easyeffects
      - lsp-plugins-lv2
      - calf
      - zam-plugins-lv2
      - mda.lv2
      - mpv
      - celluloid
      - qemu-desktop
      - virt-manager
      - swtpm
      - dnsmasq
      - vde2
      - openbsd-netcat
      - libvirt
      - llama-cpp
      - ggml-vulkan
      - vulkan-radeon
      - visual-studio-code-bin
      - ryzen_smu-dkms-git
    aur:
      - z13ctl-bin
